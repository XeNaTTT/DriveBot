workflows:
  ios-testflight:
    name: iOS TestFlight (Flutter)
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: DriveBot

    environment:
      groups:
        - Backend

      flutter: stable
      xcode: 26.6
      cocoapods: default

      vars:
        BUNDLE_ID: de.driveassistant.ar
        APPLE_TEAM_ID: QLQ959FUNR
        APP_STORE_APPLE_ID: "6772303578"

        # Wichtig:
        # Übergibt die App-Store-Apple-ID direkt an Apples altool.
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--apple-id 6772303578"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.driveassistant.ar

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true
          source: true

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Toolchain diagnostics
        script: |
          set -e

          echo "=== Flutter ==="
          flutter --version

          echo "=== Dart ==="
          dart --version

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== App configuration ==="
          echo "Bundle ID: $BUNDLE_ID"
          echo "App Store Apple ID: $APP_STORE_APPLE_ID"
          echo "altool args: $APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS"

      - name: Flutter clean
        script: |
          set -e
          flutter clean

      - name: Select CocoaPods dependency integration
        script: |
          set -e

          # flutter_compass does not provide a Swift Package Manager manifest.
          # Keep all iOS plugins on the CocoaPods path instead of letting a
          # runner-wide Flutter setting attempt a mixed SPM/CocoaPods build.
          flutter config --no-enable-swift-package-manager

      - name: Resolve Flutter dependencies
        script: |
          set -e
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          set -e
          JOLT_DIR=ios/DriveBotJolt/Vendor/Jolt
          if [ ! -f "$JOLT_DIR/Jolt/Jolt.h" ]; then
            rm -rf "$JOLT_DIR"
            git clone --depth 1 --branch v5.6.0 https://github.com/jrouwe/JoltPhysics.git "$JOLT_DIR"
          fi
          test "$(git -C "$JOLT_DIR" rev-parse HEAD)" = "e77f175595e64cb44218cc9d9d56fc365ad0e36a"
          test -z "$(git -C "$JOLT_DIR" status --porcelain --untracked-files=no)"
          cd ios
          pod install
          cd ..

      - name: Build native Jolt component
        script: |
          set -e
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme DriveBotJolt \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Set up iOS code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Generate unique App Store build number
        script: |
          set -e

          # App Store Connect rejects a CFBundleVersion that was used by any
          # previous upload. A UTC timestamp is independent of API query scope
          # and remains monotonically increasing across Codemagic workflows.
          NEXT_BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)

          echo "Generated build number: $NEXT_BUILD_NUMBER"
          echo "NEXT_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> "$CM_ENV"

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building with build number: $NEXT_BUILD_NUMBER"

          flutter build ipa \
            --release \
            --build-number="$NEXT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
