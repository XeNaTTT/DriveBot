workflows:
  ios-testflight:
    name: iOS TestFlight (Flutter)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - Backend

      flutter: stable
      xcode: 26.6
      cocoapods: default

      vars:
        BUNDLE_ID: de.driveassistant.ar
        APPLE_TEAM_ID: QLQ959FUNR
        APP_STORE_APPLE_ID: 6772303578

      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.driveassistant.ar

    integrations:
      app_store_connect: DriveBot

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Toolchain diagnostics
        script: |
          set -e
          echo "Flutter:"
          flutter --version

          echo "Dart:"
          dart --version

          echo "Xcode:"
          xcodebuild -version

          echo "Bundle ID:"
          echo "$BUNDLE_ID"

          echo "App Store Apple ID:"
          echo "$APP_STORE_APPLE_ID"

      - name: Flutter clean
        script: |
          flutter clean

      - name: Resolve Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Determine next App Store build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")

          echo "Latest App Store build number: $LATEST_BUILD_NUMBER"

          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Next build number: $NEXT_BUILD_NUMBER"

          echo "NEXT_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> $CM_ENV

      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --build-number="$NEXT_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
